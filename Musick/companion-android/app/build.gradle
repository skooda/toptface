plugins {
    id 'com.android.application'
}

android {
    namespace 'eu.drmax.musick.companion'
    compileSdk 34

    defaultConfig {
        applicationId 'eu.drmax.musick.companion'
        minSdk 21
        // Stay on targetSdk 33: the bundled PebbleKit 4.0.1 registers its
        // BroadcastReceiver without the RECEIVER_EXPORTED/NOT_EXPORTED flag,
        // which crashes under the targetSdk 34+ rule on Android 14+ devices.
        targetSdk 33
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // PebbleKit Android, from Maven Central.
    implementation 'com.getpebble:pebblekit:4.0.1'
}

// PebbleKit drags in the legacy split kotlin-stdlib-jdk7/jdk8 (1.6.21), which
// clashes with the merged kotlin-stdlib (1.8+) from appcompat. Align them.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
